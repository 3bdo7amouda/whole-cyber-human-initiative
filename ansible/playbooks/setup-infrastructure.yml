---
- name: Complete System Setup - Infrastructure Components
  hosts: all
  become: yes
  gather_facts: yes
  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install system packages
      apt:
        name: "{{ system_packages }}"
        state: present
        update_cache: yes

    - name: Check if Docker is installed
      command: docker --version
      register: docker_check
      ignore_errors: yes
      changed_when: false

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      when: docker_check.rc != 0

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
      when: docker_check.rc != 0

    - name: Install Docker
      apt:
        name: docker-ce
        state: present
        update_cache: yes
      when: docker_check.rc != 0

    - name: Add users to docker group
      user:
        name: "{{ item }}"
        groups: docker
        append: yes
      loop: "{{ docker.users }}"
      when: docker_check.rc != 0

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Check if Docker Compose is installed
      command: docker-compose --version
      register: compose_check
      ignore_errors: yes
      changed_when: false

    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/v{{ docker.compose_version }}/docker-compose-{{ ansible_system }}-{{ ansible_architecture }}"
        dest: /usr/local/bin/docker-compose
        mode: '0755'
      when: compose_check.rc != 0

    - name: Check if PostgreSQL is installed
      command: psql --version
      register: postgres_check
      ignore_errors: yes
      changed_when: false

    - name: Install PostgreSQL
      apt:
        name: 
          - "postgresql-{{ postgresql.version }}"
          - postgresql-contrib
          - python3-psycopg2
        state: present
      when: postgres_check.rc != 0

    - name: Start and enable PostgreSQL service
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Create PostgreSQL databases
      postgresql_db:
        name: "{{ item.name }}"
        state: present
      loop: "{{ postgresql.databases }}"
      become_user: postgres
      when: postgres_check.rc != 0

    - name: Create PostgreSQL users
      postgresql_user:
        name: "{{ item.user }}"
        password: "{{ item.password }}"
        db: "{{ item.name }}"
        priv: ALL
        state: present
      loop: "{{ postgresql.databases }}"
      become_user: postgres
      when: postgres_check.rc != 0

    - name: Check if Redis is installed
      command: redis-server --version
      register: redis_check
      ignore_errors: yes
      changed_when: false

    - name: Install Redis
      apt:
        name: redis-server
        state: present
      when: redis_check.rc != 0

    - name: Configure Redis
      lineinfile:
        path: /etc/redis/redis.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        backup: yes
      loop:
        - { regexp: '^maxmemory ', line: "maxmemory {{ redis.maxmemory }}" }
        - { regexp: '^maxmemory-policy ', line: "maxmemory-policy {{ redis.maxmemory_policy }}" }
      notify: restart redis
      when: redis_check.rc != 0

    - name: Start and enable Redis service
      systemd:
        name: redis-server
        state: started
        enabled: yes

    - name: Check if Nginx is installed
      command: nginx -v
      register: nginx_check
      ignore_errors: yes
      changed_when: false

    - name: Install Nginx
      apt:
        name: nginx
        state: present
      when: nginx_check.rc != 0

    - name: Start and enable Nginx service
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Remove default Nginx site
      file:
        path: "{{ nginx.sites_enabled_path }}/default"
        state: absent
      when: nginx.default_site == false and nginx_check.rc != 0
      notify: restart nginx

    - name: Check if UFW is installed
      command: ufw --version
      register: ufw_check
      ignore_errors: yes
      changed_when: false

    - name: Install UFW
      apt:
        name: ufw
        state: present
      when: ufw_check.rc != 0

    - name: Configure UFW default policies
      ufw:
        direction: "{{ ufw.default_policy.direction }}"
        policy: "{{ ufw.default_policy.policy }}"
      when: ufw.enabled

    - name: Configure UFW rules
      ufw:
        rule: "{{ item.rule }}"
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop: "{{ ufw.rules }}"
      when: ufw.enabled

    - name: Enable UFW
      ufw:
        state: enabled
      when: ufw.enabled

    - name: Check if Fail2ban is installed
      command: fail2ban-client --version
      register: fail2ban_check
      ignore_errors: yes
      changed_when: false

    - name: Install Fail2ban
      apt:
        name: fail2ban
        state: present
      when: fail2ban_check.rc != 0

    - name: Configure Fail2ban jail.local
      template:
        src: jail.local.j2
        dest: /etc/fail2ban/jail.local
        backup: yes
      notify: restart fail2ban
      when: fail2ban.enabled and fail2ban_check.rc != 0

    - name: Start and enable Fail2ban service
      systemd:
        name: fail2ban
        state: started
        enabled: yes
      when: fail2ban.enabled

  handlers:
    - name: restart redis
      systemd:
        name: redis-server
        state: restarted

    - name: restart nginx
      systemd:
        name: nginx
        state: restarted

    - name: restart fail2ban
      systemd:
        name: fail2ban
        state: restarted